    - name: Katelyn Kostakis, M.P.H.
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: | 
        Program Administrator at the Yale School of Public Health, Society, Connectedness and Health (SOCAH) Lab
      bio: |
        Katelyn Kostakis is a Program Administrator at the Yale School of Public Health. Upon earning her Master of Public Health from Yale in May 2024, she transitioned into a full-time role with The Society, Connectedness, and Health (SOCAH) group. Prior to joining Yale, Katelyn gained experience in diverse public health environments, including community health centers and local health departments, where she focused on planning and evaluating interventions. At SOCAH, Katelyn contributes to various projects and initiatives in the realm of social connectedness. She is committed to improving community access to public health information and ensuring that communities have opportunities to engage with public health initiatives.
      image: /Images/Collaborator Headshots/katelyn-kostakis.jpeg
      linkedin: https://www.linkedin.com/in/katelyn-kostakis/
      group: https://www.socahlab.org/teambios
    - name: Magalí P. Bazzano, M.S.
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: | 
        Program Manager at the Yale Center for Geospatial Solutions
      bio: |
        Magalí Bazzano joined Yale University in 2023, initially supporting various initiatives established and managed by the Office of the Vice Provost for Research. Today, she is fully devoted to the Yale Center for Geospatial Solutions, supporting the center’s continued development. She is integral to the functioning of the center, overseeing and streamlining a wide range of operations.  She ensures that all activities within the center run efficiently by aligning team efforts with strategic objectives, and providing consistent support to ensure smooth day-to-day operations.  In collaboration with leadership, Magalí helps drive operational improvements and ensures the recruitment of the necessary talent to meet the center’s dynamic needs. One of her first major accomplishments was bringing the center’s digital presence to life through the development and launch of its website, which went live on February 19, 2024. She continues to shape and maintain the site in collaboration with the media team, ensuring it reflects the center’s evolving work.
      image: /Images/Collaborator Headshots/magalí-bazzano.jpeg
      ysph-site: https://geospatial.yale.edu/profile/magali-bazzano
      group: https://geospatial.yale.edu/
      email: magali.bazzano@yale.edu
