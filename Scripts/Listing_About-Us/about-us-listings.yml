    - name: Insang Song, Ph.D.
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: | 
        Assistant Professor in the Department of Geography, College of Social Sciences at Seoul National University
      bio: |
        In the Department of Geography, Dr. Song's role is to teach and research geographic information science, quantitative geography, machine learning, and parallel computing in geospatial applications. Current projects include developing reproducible high-resolution spatiotemporal air pollution models in Korea and the U.S., impact of environmental subregions in effect estimation of green space on mental illness, spatiotemporal imputation, missing value mechanisms, and others.
      image: /Images/Collaborator Headshots/insang-song.jpeg
      ysph-site: https://sigmafelix.wixsite.com/mysite
    - name: Hui (Henry) Luan, Ph.D.
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: | 
        Assistant Professor at the UT Southwestern School of Public Health
      bio: |
        As a spatial epidemiologist and spatial data scientist, Dr. Luan investigates two major questions. First, how do health phenomena vary over space, time, and race/ethnicity? Second, what environmental factors (social, physical, and built) contribute to these spatial, temporal, and racial/ethnic variations? He uses Bayesian spatiotemporal statistics and Geographical Information Science (GIS) to answer these questions. The goal of Dr. Luan's research is to advance Bayesian probabilistic inferences in spatial health data analysis, promote the application of GIS and spatial analysis in public health, inform the development of geographically tailored, evidence-based health intervention programs, and ultimately improve population health.
      image: /Images/Collaborator Headshots/hui-luan.jpeg
      ysph-site: https://profiles.utsouthwestern.edu/profile/230334/hui-luan.html
      group: https://h3luan.github.io/
      email: hui.luan@utsouthwestern.edu