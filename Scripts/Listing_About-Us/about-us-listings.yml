    - name: Yukun (Gordon) Tu
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: | 
        Data Visualization Consultant at Yale Center for Geospatial Solutions 
      bio: |
        Gordon Tu is a data visualization designer and developer whose work bridges design and software engineering. As a Data Visualization Consultant at the Yale Center for Geospatial Solutions, he creates interactive tools for communicating environmental hazards and risk-modeling data. He is constantly exploring new tools (recently including Blender, Aerialod, and Houdini) to find new ways to create compelling visuals. Previously, Gordon developed custom visualizations and enterprise visualization libraries for organizations including Visa, Coca-Cola, Nissan, Al Gore’s office, and UC Berkeley’s Terner Center. Outside of work, he practices Taiji and is learning to play guitar.
      image: /Images/Collaborator Headshots/gordon-tu.png
      ysph-site: https://gordontu.com/
      linkedin: https://www.linkedin.com/in/gordon-tu/
    - name: Nicolas Begotka
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: | 
        Data Scientist at the Yale Center for Geospatial Solutions
      bio: |
        Nick Begotka is a data scientist contractor at YCGS using geospatial analysis and machine learning to solve climate problems. He previously worked as a data scientist at the Yale Program on Climate Change Communication, where he modeled climate risk perception and developed frameworks to identify populations vulnerable to extreme heat. Nick hopes to use advancements in machine learning and AI to improve climate solutions. In his free time, he enjoys staying active, touching grass, and experimenting with new recipes.
