    - name: Jennifer Marlon, Ph.D.
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: |
        Executive Director of the Yale Center for Geospatial Solutions and a Senior Research Scientist at the Yale School of the Environment
      bio: |
        Jennifer Marlon, Ph.D., is a climate science researcher and communicator with 20+ years of experience translating complex environmental data into actionable insights. She leads interdisciplinary efforts at the intersection of geospatial science, public opinion, and climate communication to inform policy, increase resilience, and drive public engagement. Dr. Marlon holds positions as a Senior Research Scientist and Lecturer at the Yale School of the Environment and the Yale Program on Climate Change Communication (YPCCC), and currently serves as the Executive Director of the Yale Center for Geospatial Solutions. Her interdisciplinary research examines risk and decision-making around climate change and extreme weather, as well as the physical science behind climate-wildfire interactions.
      image: /Images/Collaborator Headshots/jennifer-marlon.jpeg
      email: jennifer.marlon@yale.edu
      ysph-site: https://environment.yale.edu/directory/faculty/jennifer-marlon
      group: https://geospatial.yale.edu/
      google_scholar: https://scholar.google.com/citations?user=piwDt9kAAAAJ&hl=en
      linkedin: https://www.linkedin.com/in/jennifer-marlon-45483651/
    - name: Miriam Olivares, G.I.S.P.
      date-added: 2026-009-01
      date-updated: 2026-09-01
      titles: |
        Head of Geospatial Support Services at the Yale Center for Geospatial Solutions
      bio: |
        With 22 years of geospatial experience, Miriam Olivares coordinates GIS support services in higher education at Yale University, and previously at Texas A&M University. Her main role has been to GeoEmpower current and potential GIS users to promote teaching and cutting-edge research. She connects experts, teaches and consults GIS, enabling others to harness the power of geospatial technology. Miriam has published peer-reviewed journal articles and book chapters, participated in international GIS panels, and collaborated in projects based in the Americas, Australia, and Somalia. Her collaborations include interdisciplinary research and consulting, covering topics such as geospatial data management, GIScience, supply chain, crime analysis, natural hazards, and marine conservation, among other subjects.
      image: /Images/Collaborator Headshots/miriam-olivares.jpeg
      email: miriam.olivares@yale.edu
      ysph-site: https://geospatial.yale.edu/profile/miriam-olivares
      linkedin: https://www.linkedin.com/in/miriamo/
      group: https://geospatial.yale.edu/
    - name: Bhramar Mukherjee, Ph.D.
      date-added: 2025-06-11
      date-updated: 2025-06-11
      titles: |
        Senior Associate Dean of Public Health Data Science and Data Equity; Anna M.R. Lauder Professor of Biostatistics; Professor of Epidemiology (Chronic Diseases) and of Statistics and Data Science; Affiliated Faculty, Yale Institute for Global Health
      bio: |
        Professor Bhramar Mukherjee is the Anna M.R. Lauder Professor of Biostatistics and Professor of Chronic Disease Epidemiology at the Yale School of Public Health (YSPH). Professor Mukherjee serves as the inaugural Senior Associate Dean of Public Health Data Science and Data Equity at YSPH. She holds a secondary appointment in the Department of Statistics and Data Science and is affiliated with the MacMillan Center and the Institute for the Foundations of Data Science. She serves on the Yale Cancer Center Director’s cabinet.
